name: Release desktop app

on:
  push:
    tags:
      - "v*"

jobs:
  windows:
    name: Build Windows installer
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify platform boundaries
        run: pnpm platform:verify

      - name: Verify release version
        shell: bash
        run: |
          APP_VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          test "v${APP_VERSION}" = "${GITHUB_REF_NAME}"

      - name: Test
        run: pnpm exec vitest run --exclude '.claude/**'

      - name: Build Windows installer
        run: pnpm windows:build

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v6
        with:
          name: zerus-windows-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  publish:
    name: Publish Windows installer
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Windows installer artifact
        uses: actions/download-artifact@v7
        with:
          name: zerus-windows-nsis
          path: windows-installer

      # The macOS DMG is built, notarized and attached locally by
      # `pnpm macos:release`, which may run before or after this job.
      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "Zerus $GITHUB_REF_NAME" \
              --notes "Download the DMG for Apple Silicon Macs on macOS 26 or later, or the unsigned EXE installer for Windows. The macOS app is signed, notarized and updates itself automatically." \
              || true
          fi
          gh release upload "$GITHUB_REF_NAME" windows-installer/*.exe --clobber

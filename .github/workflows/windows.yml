name: Windows desktop build

on:
  workflow_dispatch:
    inputs:
      store:
        description: Build with the Microsoft Store product identity
        type: boolean
        default: true
  pull_request:
    paths:
      - ".github/workflows/windows.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "src/**"
      - "src-tauri/**"
      - "scripts/**"

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows EXE and MSIX
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify platform boundaries
        run: pnpm platform:verify

      - name: Build Windows installer
        run: pnpm windows:build

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v6
        with:
          name: zerus-windows-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Verify MSIX packaging logic
        run: pnpm windows:msix:test

      - name: Build Microsoft Store MSIX with SDK validation
        if: github.event_name == 'workflow_dispatch' && inputs.store
        env:
          MS_STORE_IDENTITY_NAME: ${{ vars.MS_STORE_IDENTITY_NAME }}
          MS_STORE_PUBLISHER: ${{ vars.MS_STORE_PUBLISHER }}
          MS_STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.MS_STORE_PUBLISHER_DISPLAY_NAME }}
        run: pnpm windows:msix

      - name: Upload Microsoft Store MSIX
        if: github.event_name == 'workflow_dispatch' && inputs.store
        uses: actions/upload-artifact@v6
        with:
          name: zerus-windows-msix
          path: src-tauri/target/release/bundle/msix/*_store.msix
          if-no-files-found: error
          retention-days: 30

      - name: Build development MSIX with SDK validation
        if: github.event_name != 'workflow_dispatch' || !inputs.store
        run: pnpm windows:msix --development

      - name: Upload development MSIX
        if: github.event_name != 'workflow_dispatch' || !inputs.store
        uses: actions/upload-artifact@v6
        with:
          name: zerus-windows-msix-development
          path: src-tauri/target/release/bundle/msix/*_development.msix
          if-no-files-found: error
          retention-days: 30

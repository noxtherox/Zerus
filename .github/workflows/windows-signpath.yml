name: Windows release installer

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      sign:
        description: Require SignPath signing; false preserves unsigned releases during enrollment
        type: boolean
        default: true
    secrets:
      SIGNPATH_API_TOKEN:
        required: false

permissions:
  contents: read
  actions: read

jobs:
  installer:
    name: Build and verify Windows installer
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      REQUIRE_SIGNING: ${{ github.event_name == 'workflow_dispatch' || inputs.sign }}

    steps:
      - uses: actions/checkout@v7

      - name: Check signing configuration
        if: env.REQUIRE_SIGNING == 'true'
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
        run: |
          foreach ($name in @('SIGNPATH_API_TOKEN', 'SIGNPATH_ORGANIZATION_ID', 'SIGNPATH_PROJECT_SLUG', 'SIGNPATH_SIGNING_POLICY_SLUG')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Missing $name. Complete docs/windows-signing.md before requesting a signed build."
            }
          }

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify platform boundaries
        run: pnpm platform:verify

      - name: Read and verify version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Expected a stable numeric release version.' }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw 'Release tag does not match the application version.'
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build Windows installer
        run: pnpm windows:build

      - name: Upload unsigned installer for origin verification
        id: unsigned
        uses: actions/upload-artifact@v6
        with:
          name: zerus-windows-nsis-unsigned
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7

      - name: Request SignPath approval and download signed installer
        if: env.REQUIRE_SIGNING == 'true'
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: windows-installer
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-installer
          parameters: |
            version: ${{ toJSON(steps.version.outputs.version) }}

      - name: Verify publisher, timestamp, version and signature
        if: env.REQUIRE_SIGNING == 'true'
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/verify-windows-signature.ps1 -Directory signed-installer -Version $env:APP_VERSION

      - name: Prepare unsigned installer during enrollment
        if: env.REQUIRE_SIGNING != 'true'
        shell: pwsh
        run: |
          Write-Warning 'SignPath is not enabled. This Windows installer is unsigned.'
          New-Item -ItemType Directory -Path signed-installer | Out-Null
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe signed-installer/

      - name: Upload release installer
        uses: actions/upload-artifact@v6
        with:
          name: zerus-windows-nsis
          path: signed-installer/*.exe
          if-no-files-found: error
          retention-days: 30

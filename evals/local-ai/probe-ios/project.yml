name: ZerusAIProbe
options:
  bundleIdPrefix: com.zerus.notes
  deploymentTarget:
    iOS: '26.0'
packages:
  LocalAI:
    path: ../../../packages/apple/LocalAI
  mlx-swift-lm:
    url: https://github.com/ml-explore/mlx-swift-lm
    exactVersion: 3.33.0
  swift-huggingface:
    url: https://github.com/huggingface/swift-huggingface
    from: 0.9.0
  swift-transformers:
    url: https://github.com/huggingface/swift-transformers
    exactVersion: 1.4.0
settings:
  base:
    DEVELOPMENT_TEAM: TX9RYY52XR
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '0.1'
    CURRENT_PROJECT_VERSION: '1'
targets:
  ZerusAIProbe:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: ../runner/Sources/ZerusAIEval
        excludes: [main.swift]
      - path: ../fixtures
        type: folder
        buildPhase: resources
      - path: ../tasks
        type: folder
        buildPhase: resources
    dependencies:
      - package: LocalAI
        product: ZerusLocalAICore
      - package: LocalAI
        product: ZerusLocalAI
      - package: mlx-swift-lm
        product: MLXLLM
      - package: mlx-swift-lm
        product: MLXLMCommon
      - package: mlx-swift-lm
        product: MLXEmbedders
      - package: mlx-swift-lm
        product: MLXGuidedGeneration
      - package: mlx-swift-lm
        product: MLXHuggingFace
      - package: swift-huggingface
        product: HuggingFace
      - package: swift-transformers
        product: Tokenizers
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zerus.notes.aiprobe
        CODE_SIGN_ENTITLEMENTS: Sources/Probe.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        TARGETED_DEVICE_FAMILY: '1'

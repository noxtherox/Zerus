name: ZerusNative
options:
  bundleIdPrefix: com.zerus.notes
  deploymentTarget:
    iOS: '26.0'
packages:
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup.git
    exactVersion: 2.14.3
  SwiftCmark:
    url: https://github.com/swiftlang/swift-cmark.git
    exactVersion: 0.9.0
  SwiftMarkdown:
    url: https://github.com/swiftlang/swift-markdown.git
    exactVersion: 0.9.0
  ZerusChatGPTCore:
    path: ../packages/apple/ChatGPTCore
  ZerusIOSServices:
    path: ../packages/apple/IOSServices
settings:
  base:
    SWIFT_VERSION: '5.0'
    COMPILER_INDEX_STORE_ENABLE: NO
    DEVELOPMENT_TEAM: TX9RYY52XR
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: 0.3.107
    CURRENT_PROJECT_VERSION: 1
    TARGETED_DEVICE_FAMILY: '1,2'
targets:
  ZerusNative:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: Resources
        buildPhase: resources
    dependencies:
      - package: SwiftSoup
      - package: SwiftMarkdown
        product: Markdown
      - package: ZerusIOSServices
      - package: ZerusChatGPTCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zerus.notes.native
        CODE_SIGN_ENTITLEMENTS: Entitlements.plist
        INFOPLIST_KEY_CFBundleDisplayName: Zerus Native
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Zerus Native
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Markdown note
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes: [net.daringfireball.markdown]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.zerus.notes.markdown-fragment
            UTTypeDescription: Zerus clipboard fragment
            UTTypeConformsTo: [public.data]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: net.daringfireball.markdown
            UTTypeDescription: Markdown text
            UTTypeConformsTo: [public.plain-text]
            UTTypeTagSpecification:
              public.filename-extension: [md, markdown]
              public.mime-type: text/markdown
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: Capture audio while you dictate a draft message.
        NSSpeechRecognitionUsageDescription: Transcribe your speech on this device into a draft message.
  ZerusNativeTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: ZerusNative
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.zerus.notes.native.tests
  ZerusNativeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: ZerusNative
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.zerus.notes.native.uitests
schemes:
  ZerusNative:
    build:
      targets:
        ZerusNative: all
    test:
      targets: [ZerusNativeTests, ZerusNativeUITests]

[workspace]
members = [".", "crates/zerus-core", "crates/zerus-cli", "plugins/mobile-vault"]
resolver = "2"

[package]
name = "app"
version = "0.3.14"
description = "Zerus local-first Markdown notes desktop and mobile app"
authors = ["Zerus contributors"]
license = "MIT"
repository = "https://github.com/noxtherox/Zerus"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-fs = { version = "2", features = ["watch"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-mobile-vault = { path = "plugins/mobile-vault" }
zerus-core = { path = "crates/zerus-core" }
dirs = "6"

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-process = "2"
tauri-plugin-updater = "2"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["apple-native"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSWorkspace"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSArray", "NSString", "NSURL"] }

[target.'cfg(target_os = "ios")'.dependencies]
security-framework = { version = "3.7.0", features = ["OSX_10_15"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }
tauri-plugin-single-instance = "2"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["linux-native-sync-persistent", "crypto-rust"] }

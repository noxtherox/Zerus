[package]
name = "zerus-core"
version = "0.1.0"
description = "Core Markdown vault operations for Grimoire"
authors = ["Grimoire contributors"]
license = "MIT"
repository = "https://github.com/noxtherox/grimoire"
edition = "2021"
rust-version = "1.77.2"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
uuid = { version = "1.17", features = ["serde", "v7"] }
dirs = "6.0"

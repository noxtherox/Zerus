[package]
name = "tauri-plugin-mobile-vault"
version = "0.1.0"
description = "Tauri mobile vault, AI, and speech integration for Zerus"
authors = ["Zerus contributors"]
license = "MIT"
repository = "https://github.com/noxtherox/Zerus"
edition = "2021"
rust-version = "1.77.2"
exclude = ["/examples", "/dist-js", "/guest-js", "/node_modules"]
links = "tauri-plugin-mobile-vault"

[dependencies]
tauri = { version = "2.11.3" }
serde = "1.0"
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2.6.3", features = ["build"] }
